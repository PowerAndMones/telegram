# ---------------------------------------------------------------------------
# Character Management Configuration
# ---------------------------------------------------------------------------

# Enable Character Management System
# Default: True
CharacterManagementEnabled = True

# ===========================================================================
# Nickname Change
# ===========================================================================
# Enable Nickname Change
# Default: True
NicknameChangeEnabled = True

# Cost in Adena
# Default: 1000000
NicknameChangeCost = 1000000

# Cooldown in days
# Default: 7
NicknameChangeCooldown = 7

# Maximum changes per month
# Default: 3
NicknameChangeMaxPerMonth = 3

# ===========================================================================
# Gender Change
# ===========================================================================
# Enable Gender Change
# Default: True
GenderChangeEnabled = True

# Cost in Adena
# Default: 500000
GenderChangeCost = 500000

# Cooldown in days
# Default: 30
GenderChangeCooldown = 30

# ===========================================================================
# Character Deletion
# ===========================================================================
# Enable Character Deletion
# Default: True
CharacterDeletionEnabled = True

# Delay in hours before actual deletion (grace period to cancel)
# Default: 24
CharacterDeletionDelayHours = 24

# ===========================================================================
# Unstuck
# ===========================================================================
# Enable Unstuck
# Default: True
UnstuckEnabled = True

# Cooldown in minutes
# Default: 15
UnstuckCooldown = 15

# ===========================================================================
# Class Change
# ===========================================================================
# Enable Class Change
# Default: True
ClassChangeEnabled = True

# Cost in Adena
# Default: 5000000
ClassChangeCost = 5000000

# Cooldown in days
# Default: 7
ClassChangeCooldown = 7

