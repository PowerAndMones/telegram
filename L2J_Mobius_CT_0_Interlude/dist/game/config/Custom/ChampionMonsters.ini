# ---------------------------------------------------------------------------
# Champion Monsters Configuration
# ---------------------------------------------------------------------------

# Enable Champion Monster System
# Default: True
ChampionMonstersEnabled = True

# Champion Monster Tiers Configuration
# Format: tier_name,min_level,max_level,hp_multiplier,atk_multiplier,def_multiplier,reward_adena_mult,reward_drop_mult,announce
# Low: Weak champions for low levels
ChampionTierLow = LOW,20,40,2.0,1.5,1.5,2.0,2.0,True
# Medium: Standard champions
ChampionTierMedium = MEDIUM,40,60,3.0,2.0,2.0,3.0,3.0,True
# High: Strong champions for high levels
ChampionTierHigh = HIGH,60,75,4.0,2.5,2.5,5.0,4.0,True
# Ultra: Very strong champions for endgame
ChampionTierUltra = ULTRA,76,85,6.0,3.0,3.0,10.0,5.0,True

# Global Champion Settings
# Minimum time between spawns (minutes)
ChampionGlobalRespawnMin = 30
# Maximum time between spawns (minutes)
ChampionGlobalRespawnMax = 60

# Maximum concurrent champions per tier
ChampionMaxConcurrentLow = 10
ChampionMaxConcurrentMedium = 5
ChampionMaxConcurrentHigh = 3
ChampionMaxConcurrentUltra = 1

# Champion Announcements
ChampionAnnounceSpawn = True
ChampionAnnounceDeath = True

# Champion Visual Effects
ChampionEffectGlow = True
ChampionEffectTitle = True
ChampionEffectSize = 1.2

