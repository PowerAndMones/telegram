# ---------------------------------------------------------------------------
# PvP Reward Items
# ---------------------------------------------------------------------------

# Enable PvP reward system.
# Default: True
PvpRewardEnabled = True

# Item ID rewarded for PvP kill.
# Default: 57 (Adena)
PvpRewardItemId = 57

# Amount of items rewarded per PvP kill.
# Default: 10000
PvpRewardItemCount = 10000

# Enable PvP announcements.
# Default: True
PvpAnnounceEnabled = True

# Minimum level difference to get reward.
# Default: 5
PvpRewardMinLevelDiff = 5

# Maximum reward per day per player.
# Default: 1000000
PvpRewardDailyLimit = 1000000
