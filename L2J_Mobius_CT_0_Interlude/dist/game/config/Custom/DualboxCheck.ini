# ---------------------------------------------------------------------------
# Dualbox Check - PvP Server Settings
# ---------------------------------------------------------------------------

# Maximum number of players per IP address allowed to enter game.
# Default: 0 (unlimited)
# PvP Server: 2 (dualbox allowed)
DualboxCheckMaxPlayersPerIP = 2

# Maximum number of players per IP address allowed to participate in olympiad.
# Default: 0 (unlimited)
DualboxCheckMaxOlympiadParticipantsPerIP = 1

# Maximum number of players per IP address allowed to participate in events.
# Default: 0 (unlimited)
DualboxCheckMaxL2EventParticipantsPerIP = 1

# Maximum number of players per IP address allowed to offlineplay.
# Default: 0 (unlimited)
DualboxCheckMaxOfflinePlayPerIP = 1

# Maximum number of premium players per IP address allowed to offlineplay.
# Default: 0 (unlimited)
DualboxCheckMaxOfflinePlayPremiumPerIP = 2

# Count offline traders as dualbox.
# Default: False
DualboxCountOfflineTraders = False

# Whitelist of the addresses for dualbox checks.
# Default: 127.0.0.1,0 (no limits from localhost)
DualboxCheckWhitelist = 127.0.0.1,0
